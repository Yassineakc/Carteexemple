<!DOCTYPE html> 
<html lang="fr"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <meta name="theme-color" content="#080808"> 
  <meta name="description" content="Carte de contact de Yassine AKCHICHE"> 
  <title>Yassine AKCHICHE | Contact</title> 

  <style> 
    * { margin: 0; padding: 0; box-sizing: border-box; } 

    body { 
      min-height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: radial-gradient(circle at 50% 10%, #252525 0%, #111 35%, #050505 70%); 
      color: white; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 25px; 
    } 

    .card { 
      width: 100%; 
      max-width: 420px; 
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px); 
      border: 1px solid rgba(255,255,255,.13); 
      border-radius: 30px; 
      padding: 38px 25px 25px; 
      text-align: center; 
      box-shadow: 0 30px 100px rgba(0,0,0,.65); 
      position: relative; 
      overflow: hidden; 
    } 

    .card::before { 
      content: ""; 
      position: absolute; 
      width: 220px; 
      height: 220px; 
      background: rgba(255,255,255,.06); 
      filter: blur(70px); 
      top: -100px; 
      left: 50%; 
      transform: translateX(-50%); 
      border-radius: 50%; 
    } 

    .photo-wrapper { 
      width: 125px; 
      height: 125px; 
      margin: auto; 
      border-radius: 50%; 
      padding: 3px; 
      background: linear-gradient(135deg, white, #777); 
      position: relative; 
      z-index: 2; 
      box-shadow: 0 15px 35px rgba(0,0,0,.45); 
    } 

    .photo { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      border-radius: 50%; 
      display: block; 
    } 

    h1 { 
      margin-top: 22px; 
      font-size: 27px; 
      letter-spacing: -.5px; 
      font-weight: 750; 
    } 

    .location { 
      margin-top: 10px; 
      color: #888; 
      font-size: 13px; 
    } 

    .contact-button { 
      width: 100%; 
      margin-top: 28px; 
      border: none; 
      padding: 17px 20px; 
      background: white; 
      color: #080808; 
      border-radius: 16px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: .2s ease; 
      box-shadow: 0 12px 30px rgba(0,0,0,.3); 
    } 

    .contact-button:hover { 
      transform: translateY(-2px); 
    } 

    .contact-button:active { 
      transform: scale(.98); 
    } 

    .links { 
      margin-top: 14px; 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
    } 

    .link { 
      text-decoration: none; 
      color: white; 
      background: rgba(255,255,255,.065); 
      border: 1px solid rgba(255,255,255,.09); 
      padding: 16px 6px; 
      border-radius: 16px; 
      font-size: 12px; 
      transition: .2s ease; 
    } 

    .link:hover { 
      background: rgba(255,255,255,.12); 
      transform: translateY(-2px); 
    } 

    .icon { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 27px; 
      font-size: 23px; 
      margin-bottom: 7px; 
      font-weight: 800; 
    } 

    .social-svg { 
      width: 25px; 
      height: 25px; 
      display: block; 
    } 

    .number { 
      margin-top: 20px; 
      font-size: 13px; 
      color: #8f8f8f; 
    } 

    footer { 
      margin-top: 25px; 
      color: #4d4d4d; 
      font-size: 9px; 
      letter-spacing: 2px; 
    } 

    @media(max-width: 400px) { 
      body { 
        padding: 15px; 
      } 

      .card { 
        padding: 32px 18px 22px; 
      } 

      h1 { 
        font-size: 24px; 
      } 
    } 
  </style> 
</head> 

<body> 

  <div class="card"> 

    <!-- PHOTO --> 
    <div class="photo-wrapper"> 
      <img 
        class="photo" 
        src="photo.png" 
        alt="Yassine AKCHICHE" 
      > 
    </div> 

    <!-- NOM --> 
    <h1>Yassine AKCHICHE</h1> 

    <!-- LOCALISATION --> 
    <div class="location"> 
      📍 France 
    </div> 

    <!-- AJOUTER AUX CONTACTS --> 
    <button 
      class="contact-button" 
      onclick="downloadVCard()" 
    > 
      ＋ Ajouter aux contacts 
    </button> 

    <!-- LIENS --> 
    <div class="links"> 

      <!-- TÉLÉPHONE --> 
      <a 
        class="link" 
        href="tel:+33615910076" 
      > 
        <span class="icon">📞</span> 
        Appeler 
      </a> 

      <!-- WHATSAPP --> 
      <a 
        class="link" 
        href="https://wa.me/33615910076"
        target="_blank"
        rel="noopener"
      >
        <span class="icon">💬</span>
        WhatsApp
      </a>

      <!-- MAPS -->
      <a
        class="link"
        href="https://www.google.com/maps/search/?api=1&query=43.23330363881374,0.0738241045962471"
        target="_blank"
        rel="noopener"
      >
        <span class="icon">📍</span>
        Localisation
      </a>

      <!-- INSTAGRAM -->
      <a
        class="link"
        href="https://www.instagram.com/yassine_akc/"
        target="_blank"
        rel="noopener"
      >
        <span class="icon">
          <svg
            class="social-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="5"
              ry="5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <circle
              cx="12"
              cy="12"
              r="4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <circle
              cx="17.5"
              cy="6.5"
              r="1.2"
              fill="currentColor"
            />
          </svg>
        </span>
        Instagram
      </a>

    </div>

    <!-- NUMÉRO -->
    <div class="number">
      +33 6 15 91 00 76
    </div>

    <footer>
      DIGITAL BUSINESS CARD
    </footer>

  </div>

  <script>
    function downloadVCard() {
      const vCard = `BEGIN:VCARD
VERSION:3.0
N:AKCHICHE;Yassine;;;
FN:Yassine AKCHICHE
TEL;TYPE=CELL:+33615910076
URL;TYPE=Maps:https://www.google.com/maps/search/?api=1&query=43.23330363881374,0.0738241045962471
URL;TYPE=Instagram:https://www.instagram.com/yassine_akc/
END:VCARD`;

      const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Yassine-AKCHICHE.vcf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script> 

</body> 
</html>
